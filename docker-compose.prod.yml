name: mmm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Brak POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Brak POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Brak POSTGRES_PASSWORD}
    volumes:
      - mmm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mmm-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Brak POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Brak POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Brak POSTGRES_PASSWORD}
      MMM_CORS_ALLOWED_ORIGINS: ${MMM_CORS_ALLOWED_ORIGINS:?Brak MMM_CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      mmm-network:
        aliases:
          - mmm-backend


  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      mmm-network:
      hedgehog-network:
        aliases:
          - mmm-frontend

volumes:
  mmm-db-data:

networks:
  mmm-network:
    driver: bridge
  hedgehog-network:
    external: true
    name: hedgehog-pace_hedgehog-network
