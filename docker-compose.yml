services:
  db:
    image: postgres:16-alpine
    container_name: mmm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmm_makros
      POSTGRES_USER: mmm
      POSTGRES_PASSWORD: mmm
    volumes:
      - mmm-db-data:/var/lib/postgresql/data
    ports:
      - '5430:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mmm -d mmm_makros']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: mmm-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mmm_makros
      SPRING_DATASOURCE_USERNAME: mmm
      SPRING_DATASOURCE_PASSWORD: mmm
      MMM_CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'

  frontend:
    build:
      context: ./frontend
    container_name: mmm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8081:80'

volumes:
  mmm-db-data:
