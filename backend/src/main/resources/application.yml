spring:
  application:
    name: makros-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mmm_makros}
    username: ${SPRING_DATASOURCE_USERNAME:mmm}
    password: ${SPRING_DATASOURCE_PASSWORD:mmm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

mmm:
  cors:
    allowed-origins: ${MMM_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.mmm.makros: INFO
