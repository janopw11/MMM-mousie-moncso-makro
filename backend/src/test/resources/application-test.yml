spring:
  datasource:
    url: jdbc:h2:mem:mmm_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
mmm:
  search:
    full-text: false
  cors:
    allowed-origins: http://localhost:5173
